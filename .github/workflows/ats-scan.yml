name: ATS scan

# Target-company boards, split across a 3-day rotation so no single run has to
# fetch 50+ endpoints. Data is committed back, so a partial run costs coverage
# for one day, not the board.

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 07:00 America/New_York (11:00 UTC), weekdays
  workflow_dispatch:
    inputs:
      shard_of:
        description: "Days to spread the company list over (1 = all today)"
        default: "3"

permissions:
  contents: write

concurrency:
  group: job-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan ATS boards
        id: scan
        continue-on-error: true
        run: |
          python -m scanner.run \
            --source ats \
            --shard-of "${{ github.event.inputs.shard_of || 3 }}" \
            --min-match 45 \
            --fail-under 0.6 | tee run.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## ATS scan"
            echo '```'
            cat run.log 2>/dev/null || echo "no log"
            echo '```'
            echo "### Top matches"
            echo '```'
            head -60 docs/digest.txt 2>/dev/null || echo "no digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        if: always()
        run: |
          git config user.name  "job-scanner"
          git config user.email "actions@github.com"
          git add -A state docs
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "ats scan $(date -u +%Y-%m-%dT%H:%M)"
          git push

      - name: Flag a degraded run
        if: steps.scan.outcome == 'failure'
        run: |
          echo "More than 40% of boards failed. See state/last_run.json." >&2
          exit 1
